<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Photo Booth Poster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Great+Vibes&family=Zen+Old+Mincho:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* One A4 sheet, white for any printer; the QR points at this site (or at the address after # for a preview). */
@page { size: A4; margin: 0; }
:root { --ink: #111; --gold: #A8822E; --soft: #555; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #E9E6DF; color: var(--ink); font-family: "Noto Sans JP", sans-serif; }
.sheet { width: 210mm; height: 297mm; margin: 0 auto; background: #FFF; padding: 12mm; position: relative; overflow: hidden; }
.frame { position: absolute; inset: 8mm; border: 0.8mm solid var(--gold); outline: 0.3mm solid var(--gold); outline-offset: -2.2mm; }
.inner { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 10mm; }
.school { font-family: "Great Vibes", cursive; font-size: 13mm; color: var(--gold); line-height: 1; }
.title { font-family: "Bodoni Moda", serif; font-weight: 700; font-size: 19mm; letter-spacing: 1.5mm; margin: 2mm 0 0; line-height: 1.05; }
.eyebrow { font-family: "Bodoni Moda", serif; font-weight: 500; font-size: 6mm; letter-spacing: 3mm; color: var(--gold); margin: 2mm 0 0; }
.lead { font-family: "Zen Old Mincho", serif; font-size: 7mm; margin: 7mm 0 0; }
.qr { width: 92mm; height: 92mm; margin-top: 6mm; }
.qr svg { width: 100%; height: 100%; display: block; }
.url { font-size: 4.2mm; color: var(--soft); margin-top: 1mm; letter-spacing: 0.2mm; }
ol { list-style: none; padding: 0; margin: 8mm 0 0; text-align: left; font-size: 6.2mm; font-weight: 700; }
li { display: flex; align-items: center; gap: 4mm; margin: 0 0 3.5mm; }
li b { flex: none; width: 9mm; height: 9mm; border-radius: 50%; background: var(--ink); color: #FFF; display: grid; place-items: center; font-family: "Bodoni Moda", serif; font-size: 5.5mm; }
.fine { margin-top: auto; padding-bottom: 6mm; font-size: 3.7mm; color: var(--soft); line-height: 1.7; }
@media screen { body { padding: 16px 0; } .sheet { box-shadow: 0 2px 16px rgba(0,0,0,.25); } }
@media screen and (max-width: 800px) { .sheet { zoom: 0.45; } }
@media print { html, body { background: #FFF; } }
</style>
</head>
<body>
<div class="sheet">
  <div class="frame"></div>
  <div class="inner">
    <div class="school">Keio High School</div>
    <h1 class="title">CASINO NIGHT</h1>
    <p class="eyebrow">PHOTO BOOTH</p>
    <p class="lead">あなたのスマホで、カジノの一枚を。</p>
    <div class="qr" id="qr"></div>
    <div class="url" id="url"></div>
    <ol>
      <li><b>1</b><span>スマホのカメラでQRコードを読み取る</span></li>
      <li><b>2</b><span>「撮影をはじめる」を押して1枚撮る</span></li>
      <li><b>3</b><span>背景とフレームを選んで保存</span></li>
    </ol>
    <p class="fine">アプリ不要・無料。写真はスマホの中だけで作られ、どこにも送られません。<br>
      はじめにAIのデータ（<span id="size">約20MB</span>）を読み込みます。並んでいる間に開いておくと待たずに撮れます。</p>
  </div>
</div>
<script>
const site = location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : location.origin + '/';
const target = site + '?openExternalBrowser=1';
const qr = qrcode(0, 'M'); qr.addData(target); qr.make();
document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 32, scalable: true, alt: target });
document.getElementById('url').textContent = site.replace(/^https?:\/\//, '').replace(/\/$/, '');
</script>
</body>
</html>
