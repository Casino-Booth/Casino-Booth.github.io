/* Layout: full-screen phone app, one screen at a time; one dark casino-lounge look in every theme */

[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }

#preview { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#live-note { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); margin: 0; max-width: 90%; background: rgba(0, 0, 0, 0.7); color: var(--gold-hi); padding: 6px 12px; border-radius: 999px; font-size: 13px; text-align: center; }

.work-text { margin: 0; font-family: var(--f-jp); font-size: 20px; color: var(--gold-hi); }

.result-frame { display: flex; justify-content: center; width: 100%; }
#result { display: block; max-width: 100%; max-height: 54vh; width: auto; height: auto; border-radius: 4px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6); }

.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg button { background: var(--panel); color: var(--muted); border: 1px solid #2E2A20; border-radius: 10px; padding: 9px 4px; font-size: 14px; }
.seg button[aria-pressed="true"] { color: #1A1406; background: var(--gold); border-color: var(--gold); }
.actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
#save-msg { margin: 0; min-height: 1.4em; font-size: 14px; color: var(--gold-hi); max-width: 26em; text-align: center; }
.status { margin: 0; font-family: var(--f-mono); font-size: 11px; line-height: 1.5; color: var(--muted); text-align: center; max-width: 34em; }

@media (prefers-reduced-motion: reduce) {
  .spin, #count.pop { animation: none; }
}
</style>

}
function chipStack(x, cx, baseY, rx, n, col) {
  const ry = rx * 0.34, t = rx * 0.17, [base, edge] = CHIP[col];
  for (let i = 0; i < n; i++) {
    const y = baseY - i * t, jx = Math.sin(i * 2.3 + cx) * rx * 0.03;
    x.fillStyle = lg(x, cx - rx, 0, cx + rx, 0, [[0, 'rgba(0,0,0,0.55)'], [0.35, base], [0.6, base], [1, 'rgba(0,0,0,0.65)']]);
    x.beginPath(); x.moveTo(cx + jx + rx, y - t); x.lineTo(cx + jx + rx, y); x.ellipse(cx + jx, y, rx, ry, 0, 0, Math.PI, false);
    x.lineTo(cx + jx - rx, y - t); x.ellipse(cx + jx, y - t, rx, ry, 0, Math.PI, 0, true); x.closePath(); x.fill();
    x.fillStyle = base; x.globalAlpha = 0.55; x.fill(); x.globalAlpha = 1;
    x.fillStyle = edge;

function playingCard(x, cx, cy, w, rot, rank, suit, squash = 1) {
  const h = w * 1.4, red = suit === '♥' || suit === '♦';
  x.save(); x.translate(cx, cy); x.scale(1, squash); x.rotate(rot);

  x.fillStyle = '#FBF8F1'; rr(x, -w / 2, -h / 2, w, h, w * 0.07); x.fill();

  x.strokeStyle = 'rgba(0,0,0,0.12)'; x.lineWidth = Math.max(0.5, w * 0.01); x.stroke();
  x.fillStyle = red ? '#B3261E' : '#141414';

  x.fillText(rank, -w * 0.34, -h * 0.32);

}
function coin(x, cx, cy, r, rot, tilt) {
  x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(1, tilt);
  x.fillStyle = rg(x, -r * 0.3, -r * 0.35, 0, r * 1.25, [[0, '#FFF4C6'], [0.45, '#E4B44C'], [0.85, '#A87420'], [1, '#6E4A10']]);

  x.strokeStyle = 'rgba(255,238,180,0.85)'; x.lineWidth = r * 0.08; x.beginPath(); x.arc(0, 0, r * 0.84, 0, TAU); x.stroke();
  x.fillStyle = 'rgba(122,82,18,0.6)'; suitPath(x, '♠', r * 0.03, r * 0.03, r * 0.95);

}

// ---------- the backgrounds ----------
// Each returns { bg, fg }: bg goes behind the people, fg (optional) in front of them.
const SCENES = {
  salon(W, H) {
    const u = W / 1080, r = rng(7), c = mk(W, H), x = c.getContext('2d'), lights = [];
    x.fillStyle = lg(x, 0, 0, 0, H, [[0, '#23110A'], [0.38, '#4C2711'], [0.62, '#2C140A'], [1, '#100705']]);
    x.fillRect(0, 0, W, H);
    // arcade of lit arches on the back wall
    for (let i = -1; i <= 5; i++) {
      const cx = W * (0.06 + i * 0.22), aw = W * 0.15, top = H * 0.2, bot = H * 0.6;
      const arch = () => { x.beginPath(); x.moveTo(cx - aw / 2, bot); x.lineTo(cx - aw / 2, top + aw / 2); x.arc(cx, top + aw / 2, aw / 2, Math.PI, TAU); x.lineTo(cx + aw / 2, bot); x.closePath(); };
      x.fillStyle = rg(x, cx, H * 0.38, 0, aw * 1.3, [[0, 'rgba(255,184,98,0.75)'], [1, 'rgba(160,80,30,0.15)']]); arch(); x.fill();
      x.strokeStyle = 'rgba(240,192,112,0.75)'; x.lineWidth = 7 * u; arch(); x.stroke();
      x.fillStyle = 'rgba(22,10,4,0.85)'; x.fillRect(cx + aw * 0.6, top - 40 * u, W * 0.07, bot - top + 80 * u);
    }
    // slot machine banks at both sides
    const slot = [[255, 70, 80], [90, 150, 255], [255, 205, 90], [200, 100, 255]];
    for (const side of [0, 1]) for (let j = 0; j < 4; j++) {
      const w = 66 * u, h = 110 * u, px = side ? W - (34 + j * 82) * u - w : (34 + j * 82) * u, py = H * 0.47 + (j % 2) * 10 * u, col = slot[(j + side * 2) % 4];
      x.fillStyle = '#160B06'; x.fillRect(px - 6 * u, py - 12 * u, w + 12 * u, h + 160 * u);
      x.fillStyle = rgba(col, 0.9); x.fillRect(px, py, w, h * 0.55);
      x.fillStyle = 'rgba(255,230,160,0.9)'; x.fillRect(px, py + h * 0.7, w, 8 * u);
      glow(x, px + w / 2, py + h * 0.3, 130 * u, col, 0.4);
      lights.push([px + w / 2, py + h * 0.25, 0.7, col]);
    }
    // gaming tables under their lamps
    for (const fx of [0.3, 0.7]) {
      const cx = W * fx, cy = H * 0.66;
      glow(x, cx, cy - 60 * u, 260 * u, [255, 214, 150], 0.3);
      x.fillStyle = '#0E5236'; ellipse(x, cx, cy, 190 * u, 44 * u); x.fill();
      x.strokeStyle = 'rgba(214,170,90,0.85)'; x.lineWidth = 9 * u; x.stroke();
    }
    // red and gold carpet
    x.fillStyle = lg(x, 0, H * 0.7, 0, H, [[0, '#4A1010'], [1, '#170505']]); x.fillRect(0, H * 0.7, W, H * 0.3);
    x.strokeStyle = 'rgba(214,160,80,0.28)'; x.lineWidth = 4 * u;
    for (let k = -8; k < 16; k++) { x.beginPath(); x.moveTo(W / 2 + k * 40 * u, H * 0.7); x.lineTo(W / 2 + k * 160 * u - W * 0.5, H); x.stroke(); }
    // chandeliers
    for (const [fx, fy, s] of [[0.5, 0.09, 1.1], [0.13, 0.06, 0.7], [0.87, 0.06, 0.7]]) {
      const cx = W * fx, cy = H * fy, k = s * u;
      glow(x, cx, cy + 50 * k, 340 * k, [255, 188, 110], 0.6);
      for (const [rx, dy, n] of [[170, 0, 22], [126, 46, 18], [82, 86, 14], [38, 116, 8]]) {
        for (let j = 0; j < n; j++) {
          const a = j / n * TAU, px = cx + Math.cos(a) * rx * k, py = cy + dy * k + Math.sin(a) * rx * k * 0.25;
          x.fillStyle = '#FFF1D2'; x.beginPath(); x.arc(px, py, 5 * k, 0, TAU); x.fill();
          if (Math.sin(a) > -0.3) lights.push([px, py, s]);
        }
      }
    }
    const b = blurCanvas(c, 20 * u), bx = b.getContext('2d');
    free(c);
    for (const L of lights) if (r() < 0.5) bokeh(bx, L[0] + (r() - 0.5) * 24 * u, L[1] + (r() - 0.5) * 16 * u, (12 + r() * 26) * u * L[2], L[3] || [255, 214, 150], 0.22 + r() * 0.3);
    for (let k = 0; k < 46; k++) {
      const col = [[255, 214, 150], [255, 190, 110], [255, 240, 210], [255, 120, 90]][Math.floor(r() * 4)];
      bokeh(bx, r() * W, H * (0.03 + r() * 0.62), (10 + r() * 46) * u, col, 0.08 + r() * 0.2);
    }
    vignette(bx, W, H, 0.5);
    return { bg: b };
  },

  table(W, H) {
    const u = W / 1080, r = rng(21), c = mk(W, H), x = c.getContext('2d'), lights = [];
    x.fillStyle = lg(x, 0, 0, 0, H, [[0, '#04100B'], [0.45, '#0C2C20'], [0.75, '#081A12'], [1, '#030806']]);
    x.fillRect(0, 0, W, H);
    // wood panels with gold trim
    for (let k = 0; k < 7; k++) {
      const px = k * W / 6 - W * 0.04;
      x.fillStyle = 'rgba(40,22,10,0.7)'; x.fillRect(px, H * 0.08, W * 0.1, H * 0.5);
      x.strokeStyle = 'rgba(212,170,90,0.55)'; x.lineWidth = 4 * u; x.strokeRect(px + 10 * u, H * 0.1, W * 0.1 - 20 * u, H * 0.46);
    }
    // far tables in pools of lamp light
    for (const [fx, fy, s] of [[0.18, 0.5, 0.8], [0.5, 0.47, 0.9], [0.82, 0.5, 0.8]]) {
      const cx = W * fx, cy = H * fy, lamp = H * 0.13;
      x.fillStyle = lg(x, 0, lamp, 0, cy, [[0, 'rgba(255,226,160,0.32)'], [1, 'rgba(255,226,160,0.04)']]);
      x.beginPath(); x.moveTo(cx - 40 * u * s, lamp); x.lineTo(cx + 40 * u * s, lamp); x.lineTo(cx + 230 * u * s, cy); x.lineTo(cx - 230 * u * s, cy); x.closePath(); x.fill();
      x.fillStyle = '#12704A'; ellipse(x, cx, cy, 220 * u * s, 52 * u * s); x.fill();
      glow(x, cx, cy, 200 * u * s, [140, 255, 190], 0.18);
      x.strokeStyle = 'rgba(214,170,90,0.9)'; x.lineWidth = 9 * u * s; ellipse(x, cx, cy, 220 * u * s, 52 * u * s); x.stroke();
      x.fillStyle = '#E8BE62'; x.beginPath(); x.moveTo(cx - 36 * u * s, lamp); x.lineTo(cx + 36 * u * s, lamp); x.lineTo(cx + 22 * u * s, lamp - 34 * u * s); x.lineTo(cx - 22 * u * s, lamp - 34 * u * s); x.closePath(); x.fill();
      glow(x, cx, lamp, 120 * u * s, [255, 230, 170], 0.7);
      lights.push([cx, lamp, s, [255, 230, 170]]);
      for (let k = 0; k < 6; k++) lights.push([cx + (r() - 0.5) * 360 * u * s, cy + (r() - 0.5) * 60 * u * s, 0.6, [150, 255, 200]]);
    }
    const b = blurCanvas(c, 22 * u), bx = b.getContext('2d');
    free(c);
    for (const L of lights) bokeh(bx, L[0], L[1], (16 + r() * 30) * u * L[2], L[3], 0.2 + r() * 0.3);
    for (let k = 0; k < 40; k++) {
      const col = [[255, 220, 150], [170, 255, 200], [255, 245, 220]][Math.floor(r() * 3)];
      bokeh(bx, r() * W, H * (0.04 + r() * 0.55), (10 + r() * 40) * u, col, 0.07 + r() * 0.18);
    }
    vignette(bx, W, H, 0.5);

    // the table the guests stand behind, in front of them
    const f = mk(W, H), fx = f.getContext('2d'), top = H * 0.8, R = W * 1.6;
    const cyR = top + R * 0.5;
    fx.save();
    fx.beginPath(); fx.ellipse(W / 2, cyR, R, R * 0.5, 0, 0, TAU); fx.clip();
    fx.fillStyle = lg(fx, 0, top, 0, H, [[0, '#14774D'], [0.5, '#0E5A3A'], [1, '#08361F']]); fx.fillRect(0, top - 10 * u, W, H - top + 10 * u);
    fx.globalAlpha = 0.06; fx.fillStyle = '#000';
    for (let k = 0; k < 2400 * u * u + 300; k++) fx.fillRect(r() * W, top + r() * (H - top), 2 * u, 2 * u);
    fx.globalAlpha = 1;
    fx.strokeStyle = 'rgba(232,198,120,0.75)'; fx.lineWidth = 4 * u;
    fx.beginPath(); fx.ellipse(W / 2, cyR + 70 * u, R * 0.96, R * 0.5 - 20 * u, 0, Math.PI * 1.1, Math.PI * 1.9); fx.stroke();
    fx.restore();
    // padded rail
    fx.save();
    fx.lineWidth = 46 * u; fx.strokeStyle = '#1E120B';
    fx.beginPath(); fx.ellipse(W / 2, cyR, R, R * 0.5, 0, Math.PI * 1.05, Math.PI * 1.95); fx.stroke();
    fx.lineWidth = 10 * u; fx.strokeStyle = 'rgba(255,220,180,0.22)';
    fx.beginPath(); fx.ellipse(W / 2, cyR - 12 * u, R, R * 0.5, 0, Math.PI * 1.05, Math.PI * 1.95); fx.stroke();
    fx.lineWidth = 3 * u; fx.strokeStyle = 'rgba(214,170,90,0.9)';
    fx.beginPath(); fx.ellipse(W / 2, cyR + 24 * u, R, R * 0.5, 0, Math.PI * 1.05, Math.PI * 1.95); fx.stroke();
    fx.restore();
    // chips and cards on the felt
    const by = H - (H - top) * 0.28;
    chipStack(fx, W * 0.74, by, 54 * u, 9, 'red');
    chipStack(fx, W * 0.86, by + 28 * u, 54 * u, 6, 'black');
    chipStack(fx, W * 0.64, by + 44 * u, 50 * u, 4, 'gold');
    chipStack(fx, W * 0.93, by - 40 * u, 46 * u, 3, 'purple');
    playingCard(fx, W * 0.16, by + 8 * u, 120 * u, -0.22, 'A', '♠', 0.62);
    playingCard(fx, W * 0.27, by + 18 * u, 120 * u, 0.16, 'K', '♥', 0.62);
    chipFace(fx, W * 0.42, by + 70 * u, 48 * u, 16 * u, 'green');

  velvet(W, H) {
    const u = W / 1080, r = rng(5), c = mk(W, H), x = c.getContext('2d');
    const dark = [46, 3, 8], mid = [134, 13, 26], hi = [222, 70, 70];
    const g = x.createLinearGradient(0, 0, W, 0), N = 160;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const v = clamp(0.5 + 0.34 * Math.sin(t * TAU * 6.5 + 0.7) + 0.13 * Math.sin(t * TAU * 13.7 + 2.1) + 0.05 * Math.sin(t * TAU * 29 + 0.3), 0, 1);
      g.addColorStop(t, rgba(v < 0.5 ? mix(dark, mid, v * 2) : mix(mid, hi, (v - 0.5) * 2), 1));
    }
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (let k = 0; k < 1400; k++) {
      x.fillStyle = r() < 0.5 ? 'rgba(255,150,150,0.035)' : 'rgba(0,0,0,0.06)';
      x.fillRect(r() * W, r() * H, 1.6 * u, (40 + r() * 160) * u);
    }
    x.fillStyle = lg(x, 0, 0, 0, H, [[0, 'rgba(0,0,0,0.6)'], [0.25, 'rgba(0,0,0,0.05)'], [0.7, 'rgba(0,0,0,0.12)'], [1, 'rgba(0,0,0,0.65)']]);
    x.fillRect(0, 0, W, H);
    glow(x, W * 0.5, H * 0.42, W * 0.62, [255, 120, 90], 0.34, 'screen');
    // swagged valance with gold fringe
    const n = 3, sw = W / n, vh = Math.max(H * 0.1, 120 * u);
    for (let k = 0; k < n; k++) {
      const x0 = k * sw, x1 = x0 + sw, mx = (x0 + x1) / 2;
      x.save(); x.shadowColor = 'rgba(0,0,0,0.6)'; x.shadowBlur = 30 * u; x.shadowOffsetY = 12 * u;
      x.fillStyle = lg(x, 0, 0, 0, vh * 1.3, [[0, '#3A0408'], [0.6, '#8C1020'], [1, '#C53A3D']]);
      x.beginPath(); x.moveTo(x0, 0); x.lineTo(x1, 0); x.lineTo(x1, vh * 0.45); x.quadraticCurveTo(mx, vh * 1.6, x0, vh * 0.45); x.closePath(); x.fill();
      x.restore();
      x.strokeStyle = 'rgba(255,160,150,0.18)'; x.lineWidth = 6 * u;
      for (const t of [0.35, 0.6, 0.82]) { x.beginPath(); x.moveTo(x0, vh * 0.45 * t); x.quadraticCurveTo(mx, vh * 1.6 * t, x1, vh * 0.45 * t); x.stroke(); }
      for (let j = 0; j <= 60; j++) {
        const t = j / 60, px = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * mx + t * t * x1, py = (1 - t) * (1 - t) * vh * 0.45 + 2 * (1 - t) * t * vh * 1.6 + t * t * vh * 0.45;
        x.strokeStyle = j % 2 ? '#E9C670' : '#A9822F'; x.lineWidth = 3.4 * u;
        x.beginPath(); x.moveTo(px, py - 4 * u); x.lineTo(px, py + 22 * u); x.stroke();
      }
    }
    for (let k = 1; k < n; k++) {
      const px = k * sw;
      x.fillStyle = rg(x, px - 6 * u, vh * 0.5 - 6 * u, 0, 26 * u, [[0, '#FFF0B8'], [1, '#9C7426']]);
      x.beginPath(); x.arc(px, vh * 0.5, 22 * u, 0, TAU); x.fill();
      x.fillStyle = lg(x, px - 20 * u, 0, px + 20 * u, 0, [[0, '#8E6A22'], [0.5, '#F3D88A'], [1, '#8E6A22']]);
      x.beginPath(); x.moveTo(px - 8 * u, vh * 0.5 + 18 * u); x.lineTo(px + 8 * u, vh * 0.5 + 18 * u); x.lineTo(px + 26 * u, vh * 0.5 + 120 * u); x.lineTo(px - 26 * u, vh * 0.5 + 120 * u); x.closePath(); x.fill();
    }
    const b = blurCanvas(c, 2.5 * u), bx = b.getContext('2d');
    free(c);
    vignette(bx, W, H, 0.45);
    return { bg: b };
  },

  deco(W, H) {
    const u = W / 1080, c = mk(W, H), x = c.getContext('2d'), cx = W / 2, cy = H * 0.62;
    x.fillStyle = rg(x, cx, H * 0.45, 0, Math.max(W, H) * 0.8, [[0, '#172821'], [0.55, '#0A120E'], [1, '#040605']]);
    x.fillRect(0, 0, W, H);
    const foil = () => lg(x, 0, 0, W, H, [[0, '#7D5C22'], [0.22, '#F3DC95'], [0.42, '#B48A36'], [0.62, '#FFF0BF'], [0.8, '#B48A36'], [1, '#8A6A2C']]);
    // sunburst
    x.save(); x.strokeStyle = foil(); x.globalAlpha = 0.45;
    for (let k = 0; k <= 48; k++) {
      const a = Math.PI + k / 48 * Math.PI;
      x.lineWidth = (k % 2 ? 1.6 : 3) * u;
      x.beginPath(); x.moveTo(cx + Math.cos(a) * 250 * u, cy + Math.sin(a) * 250 * u); x.lineTo(cx + Math.cos(a) * W * 1.4, cy + Math.sin(a) * W * 1.4); x.stroke();
    }
    x.restore();
    // stepped arcs behind the guests
    x.save(); x.strokeStyle = foil();
    for (const [rad, lw] of [[250, 12], [282, 3], [350, 3], [372, 1.5], [452, 7], [478, 1.5], [560, 2]]) {
      x.lineWidth = lw * u; x.beginPath(); x.arc(cx, cy, rad * u, Math.PI, TAU); x.stroke();
    }
    x.restore();
    // stepped Art Deco frame
    const stepped = (x0, y0, x1, y1, s) => {
      x.beginPath();
      x.moveTo(x0 + 2 * s, y0); x.lineTo(x1 - 2 * s, y0); x.lineTo(x1 - 2 * s, y0 + s); x.lineTo(x1 - s, y0 + s); x.lineTo(x1 - s, y0 + 2 * s); x.lineTo(x1, y0 + 2 * s);
      x.lineTo(x1, y1 - 2 * s); x.lineTo(x1 - s, y1 - 2 * s); x.lineTo(x1 - s, y1 - s); x.lineTo(x1 - 2 * s, y1 - s); x.lineTo(x1 - 2 * s, y1);
      x.lineTo(x0 + 2 * s, y1); x.lineTo(x0 + 2 * s, y1 - s); x.lineTo(x0 + s, y1 - s); x.lineTo(x0 + s, y1 - 2 * s); x.lineTo(x0, y1 - 2 * s);
      x.lineTo(x0, y0 + 2 * s); x.lineTo(x0 + s, y0 + 2 * s); x.lineTo(x0 + s, y0 + s); x.lineTo(x0 + 2 * s, y0 + s); x.closePath();
    };
    x.save(); x.strokeStyle = foil();
    x.lineWidth = 5 * u; stepped(56 * u, 56 * u, W - 56 * u, H - 56 * u, 28 * u); x.stroke();
    x.lineWidth = 1.6 * u; stepped(74 * u, 74 * u, W - 74 * u, H - 74 * u, 22 * u); x.stroke();
    // corner fans
    for (const [px, py, a0] of [[56 * u, 56 * u, 0], [W - 56 * u, 56 * u, Math.PI / 2], [W - 56 * u, H - 56 * u, Math.PI], [56 * u, H - 56 * u, Math.PI * 1.5]]) {
      for (let k = 1; k <= 3; k++) { x.lineWidth = 2 * u; x.beginPath(); x.arc(px, py, (40 + k * 22) * u, a0, a0 + Math.PI / 2); x.stroke(); }
      for (let k = 0; k <= 4; k++) { const a = a0 + k / 4 * Math.PI / 2; x.lineWidth = 1.4 * u; x.beginPath(); x.moveTo(px + Math.cos(a) * 40 * u, py + Math.sin(a) * 40 * u); x.lineTo(px + Math.cos(a) * 106 * u, py + Math.sin(a) * 106 * u); x.stroke(); }
    }
    x.restore();
    // diamonds at the middle of each side
    x.fillStyle = foil();
    for (const [px, py] of [[W / 2, 56 * u], [56 * u, H / 2], [W - 56 * u, H / 2]]) { x.beginPath(); x.moveTo(px, py - 16 * u); x.lineTo(px + 16 * u, py); x.lineTo(px, py + 16 * u); x.lineTo(px - 16 * u, py); x.closePath(); x.fill(); }
    vignette(x, W, H, 0.35);
    return { bg: c };
  },

  jackpot(W, H) {
    const u = W / 1080, r = rng(77), c = mk(W, H), x = c.getContext('2d'), cx = W / 2, cy = H * 0.36;
    x.fillStyle = rg(x, cx, cy, 0, Math.max(W, H) * 0.85, [[0, '#FFF1B8'], [0.16, '#F4C55A'], [0.5, '#B97A19'], [1, '#3A2004']]);

function balloon(x, cx, cy, r, kind, rot) {
  x.save(); x.translate(cx, cy); x.rotate(rot);
  const ry = r * 1.07;
  const pal = {
    black: [[86, 86, 96], [24, 24, 28], [6, 6, 8]],
    pearl: [[255, 252, 246], [226, 218, 204], [150, 140, 126]],
    champagne: [[250, 226, 186], [210, 170, 116], [118, 84, 48]],
    red: [[236, 84, 84], [172, 18, 32], [72, 4, 12]],

    x.fillStyle = lg(x, -r, -ry, r, ry, [[0, '#FFF4C8'], [0.22, '#E0B04A'], [0.42, '#7A5310'], [0.58, '#F2D07A'], [0.78, '#9A6C1C'], [1, '#4A3008']]);

  x.fillStyle = '#E2BF6A'; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
  x.fillStyle = '#0F3D2B';
  for (let k = 0; k < 8; k++) { const a = k / 8 * TAU; x.save(); x.translate(cx + Math.cos(a) * r * 0.82, cy + Math.sin(a) * r * 0.82); x.rotate(a); x.fillRect(-r * 0.12, -r * 0.1, r * 0.24, r * 0.2); x.restore(); }
  x.beginPath(); x.arc(cx, cy, r * 0.58, 0, TAU); x.fill();
  x.fillStyle = '#E2BF6A'; suitPath(x, '♠', cx, cy + 1, r * 0.7);
  x.restore();
}
function navIcons(x, W, cy) {
  const xs = [0.1, 0.3, 0.5, 0.7, 0.9].map((f) => f * W);
  x.save(); x.strokeStyle = '#FFFFFF'; x.fillStyle = '#FFFFFF'; x.lineWidth = 5; x.lineCap = 'round'; x.lineJoin = 'round';
  let p = xs[0];
  x.beginPath(); x.moveTo(p - 30, cy - 2); x.lineTo(p, cy - 30); x.lineTo(p + 30, cy - 2); x.moveTo(p - 22, cy - 8); x.lineTo(p - 22, cy + 28); x.lineTo(p + 22, cy + 28); x.lineTo(p + 22, cy - 8); x.stroke();
  p = xs[1];
  x.beginPath(); x.arc(p - 6, cy - 6, 22, 0, TAU); x.moveTo(p + 10, cy + 10); x.lineTo(p + 30, cy + 30); x.stroke();
  p = xs[2];
  x.fillStyle = '#D4AF5A'; rr(x, p - 40, cy - 40, 80, 80, 18); x.fill();
  x.strokeStyle = '#121212'; x.lineWidth = 6; x.beginPath(); x.arc(p, cy, 18, 0, TAU); x.stroke();
  x.fillStyle = '#121212'; x.beginPath(); x.arc(p + 24, cy - 24, 5, 0, TAU); x.fill();
  x.strokeStyle = '#FFFFFF'; x.lineWidth = 5;
  p = xs[3];
  x.save(); x.translate(p, cy); x.scale(0.62, 0.62); x.fillStyle = '#FFFFFF'; suitPath(x, '♥', 0, 2, 96); x.fillStyle = '#121212'; suitPath(x, '♥', 0, 2, 72); x.restore();
  p = xs[4];
  x.beginPath(); x.arc(p, cy - 12, 15, 0, TAU); x.stroke();
  x.beginPath(); x.arc(p, cy + 34, 30, Math.PI * 1.15, Math.PI * 1.85); x.stroke();
  x.restore();
}
function composeImage(bgId, frameId) {
  const F = FRAMES[frameId], photo = renderPhoto(bgId, F.pw, F.ph, F.top);
  const out = mk(F.w, F.h), x = out.getContext('2d');
  FRAME_DRAW[frameId](x, photo, F);
  free(photo);
  return out;
}

// ---------- camera ----------
const video = $('video');
const IN_APP = /Line\/|Instagram|FBAN|FBAV|Twitter|TikTok|musical_ly/i.test(navigator.userAgent);
async function startCamera() {
  stopCamera();
  if (!window.isSecureContext || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return 'unsupported';
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: state.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
  } catch (e) { return e && e.name === 'NotAllowedError' ? 'denied' : 'failed'; }
  video.srcObject = state.stream;
  try { await video.play(); } catch (e) { /* playback starts once metadata arrives */ }
  // Wait for real frames; a stream that never delivers them falls back to the phone's own camera.
  for (let k = 0; k < 30 && video.videoWidth < 16; k++) await sleep(100);
  video.classList.toggle('mirror', state.facing === 'user');
  return video.videoWidth >= 16 ? 'ok' : 'failed';
}
function stopCamera() {
  stopLive();
  if (state.stream) { state.stream.getTracks().forEach((t) => t.stop()); state.stream = null; }
  watchLight(false);
}
let lightTimer = null;
function watchLight(on) {
  clearInterval(lightTimer); $('dark').hidden = true;
  if (!on) return;
  const t = mk(24, 24), x = t.getContext('2d', { willReadFrequently: true });
  lightTimer = setInterval(() => {
    if (!video.videoWidth) return;
    x.drawImage(video, 0, 0, 24, 24);
    const d = x.getImageData(0, 0, 24, 24).data; let s = 0;
    for (let i = 0; i < d.length; i += 4) s += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    $('dark').hidden = s / (d.length / 4) > 72;
  }, 1000);
}

// Live preview: the people on the chosen background while they pose.
const live = { on: false, raf: 0, last: 0, small: null, maskC: null, maskData: null, person: null };
async function startLive() {
  const vis = await withTimeout(loadSegmenter(), 25000), seg = vis && vis.seg;
  if (!seg || !state.stream || live.on) {
    if (!seg) note('背景のプレビューは使えません。撮影後に合成します。');
    return;
  }
  try { await setSegMode(seg, 'VIDEO'); } catch (e) { note('背景のプレビューは使えません。撮影後に合成します。'); return; }
  live.on = true; $('preview').hidden = false; note('');
  const P = $('preview'), stage = $('stage'), dpr = Math.min(2, window.devicePixelRatio || 1);
  P.width = Math.round(stage.clientWidth * dpr); P.height = Math.round(stage.clientHeight * dpr);
  live.person = mk(P.width, P.height);
  const step = () => {
    if (!live.on) return;
    live.raf = requestAnimationFrame(step);
    const now = performance.now();
    if (now - live.last < 40 || !video.videoWidth) return;
    live.last = now;
    const vw = video.videoWidth, vh = video.videoHeight, mirror = state.facing === 'user';
    const sq = padded(video, 256, mirror, live.small), sw = sq.w, sh = sq.h;
    live.small = sq.canvas;
    if (!live.maskC || live.maskC.width !== sw || live.maskC.height !== sh) {
      live.maskC = mk(sw, sh);
      live.maskData = live.maskC.getContext('2d').createImageData(sw, sh);
      live.maskData.data.fill(255);
    }
    let m = null;
    try { m = maskFrom(seg.segmentForVideo(live.small, now)); } catch (e) { m = null; }
    const W = P.width, H = P.height, px = P.getContext('2d'), k = Math.max(W / vw, H / vh), dw = vw * k, dh = vh * k, dx = (W - dw) / 2, dy = (H - dh) / 2;
    const pc = live.person, pcx = pc.getContext('2d');
    pcx.globalCompositeOperation = 'source-over'; pcx.clearRect(0, 0, W, H);
    pcx.save(); if (mirror) { pcx.translate(W, 0); pcx.scale(-1, 1); } pcx.drawImage(video, dx, dy, dw, dh); pcx.restore();
    if (state.bg === 'real' || !m) { px.drawImage(pc, 0, 0); return; }
    const md = live.maskData.data;
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++) {
      const v = m.data[(y + sq.oy) * m.w + x + sq.ox];
      md[(y * sw + x) * 4 + 3] = v < 0.3 ? 0 : v > 0.7 ? 255 : (v - 0.3) * 637;
    }
    live.maskC.getContext('2d').putImageData(live.maskData, 0, 0);
    pcx.globalCompositeOperation = 'destination-in'; pcx.imageSmoothingQuality = 'high'; pcx.drawImage(live.maskC, dx, dy, dw, dh);
    const sc = getScene(state.bg, W, H);
    px.drawImage(sc.bg, 0, 0); px.drawImage(pc, 0, 0); if (sc.fg) px.drawImage(sc.fg, 0, 0);
  };
  step();
}
function stopLive() {
  live.on = false; cancelAnimationFrame(live.raf);
  $('preview').hidden = true;
}
function note(t) { const n = $('live-note'); n.textContent = t; n.hidden = !t; }

function grabFrame() {
  const vw = video.videoWidth, vh = video.videoHeight, k = Math.min(1, 1600 / Math.max(vw, vh));
  const c = mk(vw * k, vh * k), x = c.getContext('2d', { willReadFrequently: true });
  if (state.facing === 'user') { x.translate(c.width, 0); x.scale(-1, 1); }
  x.drawImage(video, 0, 0, c.width, c.height);
  return c;
}
function sharpness(c) {
  const w = 160, h = Math.max(3, Math.round(160 * c.height / c.width));
  const t = mk(w, h), x = t.getContext('2d', { willReadFrequently: true });
  x.drawImage(c, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  let s = 0, s2 = 0, n = 0;
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    const i = y * w + xx, l = 4 * g[i] - g[i - 1] - g[i + 1] - g[i - w] - g[i + w];
    s += l; s2 += l * l; n++;
  }
  const m = s / n; return s2 / n - m * m;
}
async function shoot() {
  if (state.busy) return;
  state.busy = true; audioOn();
  $('shutter').disabled = true; $('flip-cam').disabled = true;
  for (let n = CONFIG.countdown; n >= 1; n--) {
    const c = $('count'); c.textContent = n; c.hidden = false;
    c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop');
    sfx.tick(); await sleep(FAST ? 120 : 1000);
  }
  $('count').hidden = true; sfx.go();
  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  sfx.shutter();
  stopLive();
  const frames = [];
  for (let i = 0; i < CONFIG.burst; i++) { frames.push(grabFrame()); await sleep(70); }
  let best = frames[0], bs = -1;
  for (const fr of frames) { const s = sharpness(fr); if (s > bs) { bs = s; best = fr; } }
  frames.forEach((fr) => { if (fr !== best) free(fr); });
  stopCamera();
  state.photo = best; state.busy = false;
  await develop();
}

// ---------- the phone's own camera, when the live camera is not available ----------
function openPick(reason) {
  state.mode = 'file';
  const msg = {
    unsupported: IN_APP
      ? 'アプリ内ブラウザではライブカメラが使えません。メニューの「ブラウザで開く」でカウントダウン撮影ができます。ここではスマホのカメラで撮れます。'
      : 'このページではライブカメラが使えないので、スマホのカメラで撮ります。',
    denied: 'カメラを許可できませんでした。ほかのアプリの吹き出しなどが画面に重なっていると、許可できないことがあります。スマホのカメラなら許可なしで撮れます。',
    failed: 'カメラを起動できませんでした。スマホのカメラで撮れます。',
    choose: '',
  }[reason] || '';
  $('pick-reason').textContent = msg;
  show('s-pick');
}
async function fileToCanvas(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, k = Math.min(1, 1600 / Math.max(w, h));
  const c = mk(w * k, h * k), x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, c.width, c.height);
  if (src.close) src.close();
  return c;
}
// file-cam0 is the welcome screen's shortcut to the phone's own camera: no camera permission, so no permission dialog.
for (const id of ['file-cam0', 'file-cam', 'file-lib']) {
  $(id).addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    audioOn(); loadFonts(); loadSegmenter(); state.mode = 'file';
    try { state.photo = await fileToCanvas(file); } catch (err) { openPick('choose'); $('pick-reason').textContent = 'この写真は読み込めませんでした。別の写真で試してください。'; return; }
    e.target.value = '';
    await develop();
  });
}

// ---------- developing and choosing ----------
async function develop() {
  show('s-work'); $('work-sub').textContent = 'AIが人を切り抜いています';
  const t0 = performance.now();
  await loadFonts();
  if (state.cut) { free(state.cut.alphaCanvas); state.cut = null; }
  for (const cache of [bigScenes, smallScenes]) { for (const s of cache.values()) { free(s.bg); free(s.fg); } cache.clear(); }
  state.cutNote = '';
  state.cut = await cutOut(state.photo);
  if (!state.cut && state.bg !== 'real') state.bg = 'real';
  $('work-sub').textContent = '背景を合わせています';
  await sleep(30);
  await renderResult();
  buildPickers();
  const ms = Math.round(performance.now() - t0);
  $('status').textContent = state.cut
    ? `切り抜き ${state.cut.ms} ms ・ 全体 ${ms} ms ・ ${state.mode === 'live' ? 'ライブカメラ' : 'スマホのカメラ'}`
    : `背景の合成は使えません（${state.cutNote || '理由不明'}）。${segLog.join(' / ')}`;
  show('s-result'); $('s-result').scrollTop = 0; sfx.done();
  fillThumbs();
}
async function renderResult() {
  const t0 = performance.now();
  const c = composeImage(state.bg, state.frame);
  state.blob = await toBlob(c); free(c);
  if (state.url) URL.revokeObjectURL(state.url);
  state.url = URL.createObjectURL(state.blob); $('result').src = state.url;
  $('save-msg').textContent = '';
  return Math.round(performance.now() - t0);
}
function buildPickers() {
  const row = $('bg-row'); row.textContent = '';
  for (const b of BGS) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'bg-opt'; btn.dataset.bg = b.id;
    btn.setAttribute('aria-pressed', String(state.bg === b.id));
    btn.disabled = !state.cut && b.id !== 'real';
    const cv = mk(144, 180); btn.appendChild(cv);
    const label = document.createElement('span'); label.textContent = b.ja; btn.appendChild(label);
    btn.addEventListener('click', () => choose({ bg: b.id }));
    row.appendChild(btn);
  }
  const fr = $('frame-row'); fr.textContent = '';
  for (const [id, F] of Object.entries(FRAMES)) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.dataset.frame = id; btn.textContent = F.ja;
    btn.setAttribute('aria-pressed', String(state.frame === id));
    btn.addEventListener('click', () => choose({ frame: id }));
    fr.appendChild(btn);
  }
}
let thumbJob = 0;
async function fillThumbs() {
  const job = ++thumbJob;
  for (const btn of document.querySelectorAll('.bg-opt')) {
    await sleep(16);
    if (job !== thumbJob) return;
    const cv = btn.querySelector('canvas'), id = btn.dataset.bg;
    if (btn.disabled) { const x = cv.getContext('2d'); x.fillStyle = '#151815'; x.fillRect(0, 0, cv.width, cv.height); continue; }
    const p = renderPhoto(id, cv.width, cv.height, FRAMES.feed.top);
    cv.getContext('2d').drawImage(p, 0, 0); free(p);
  }
}
let choosing = Promise.resolve();
function choose(change) {
  Object.assign(state, change);
  document.querySelectorAll('.bg-opt').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.bg === state.bg)));
  document.querySelectorAll('#frame-row button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.frame === state.frame)));
  choosing = choosing.then(renderResult).catch(() => null);
  return choosing;
}

// ---------- saving ----------
function fileName() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `casino-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${state.bg}.jpg`;
}
$('save').addEventListener('click', async () => {
  await choosing;
  const name = fileName(), msg = $('save-msg'), file = new File([state.blob], name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.share) {
    let ok = false; try { ok = navigator.canShare({ files: [file] }); } catch (e) { ok = false; }
    if (ok) {
      try { await navigator.share({ files: [file] }); msg.textContent = '共有メニューを開きました。「画像を保存」を選ぶと写真に入ります。'; return; }
      catch (e) { if (e && e.name === 'AbortError') { msg.textContent = '保存をキャンセルしました。'; return; } }
    }
  }
  const dl = await withTimeout(getDownloads(), 3000);
  if (dl) {
    try { await dl.save({ filename: name, data: state.blob }); msg.textContent = '保存しました。'; return; }
    catch (e) { if (e && e.code === 'declined') { msg.textContent = '保存をやめました。'; return; } }
  }
  try {
    const a = document.createElement('a'); a.href = state.url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { /* the long-press hint below still works */ }
  msg.textContent = '保存されない場合は、写真を長押しして「写真に保存」を選んでください。';
});
$('again').addEventListener('click', () => { if (state.mode === 'live') openCamera(); else openPick('choose'); });

// ---------- start ----------
function buildLiveChips() {
  const row = $('live-bgs'); row.textContent = '';
  for (const b of BGS) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'chip'; btn.textContent = b.ja;
    btn.setAttribute('aria-pressed', String(state.bg === b.id));
    btn.addEventListener('click', () => {
      state.bg = b.id;
      row.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === btn)));
    });
    row.appendChild(btn);
  }
}
async function openCamera() {
  show('s-camera'); buildLiveChips(); note('');
  $('shutter').disabled = true; $('flip-cam').disabled = true;
  const res = await startCamera();
  // Inside the Claude viewer the live camera is always refused; say so plainly instead of blaming a permission.
  if (res !== 'ok') { openPick(window.claude && res === 'denied' ? 'unsupported' : res); return; }
  state.mode = 'live'; watchLight(true);
  $('shutter').disabled = false; $('flip-cam').disabled = false;
  startLive();
}
$('w-school').textContent = CONFIG.school;
$('start').addEventListener('click', () => { audioOn(); loadFonts(); loadSegmenter(); openCamera(); });
// Start the AI download while the visitor waits in line, not only after the tap.
if (!FAST) setTimeout(() => { loadFonts(); loadSegmenter(); }, 300);
$('shutter').addEventListener('click', shoot);
$('to-pick').addEventListener('click', () => { stopCamera(); openPick('choose'); });
$('flip-cam').addEventListener('click', async () => { state.facing = state.facing === 'user' ? 'environment' : 'user'; await openCamera(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (!state.busy) stopCamera(); }
  else if (state.mode === 'live' && !$('s-camera').hidden && !state.stream && !state.busy) openCamera();
});

// ---------- self-test (only with #autotest-... in the address) ----------
if (FAST) {
  window.__booth = state; window.__out = {}; window.__log = segLog; window.__times = {};
  setTimeout(async () => {
    try {
      if (TEST.startsWith('autotest-file')) {
        const blob = await (await fetch('test/selfie.jpg')).blob();
        state.mode = 'file'; state.photo = await fileToCanvas(blob);
        await develop();
        if (state.cut) {
          const mc = mk(state.cut.w, state.cut.h), mx = mc.getContext('2d');
          mx.fillStyle = '#000'; mx.fillRect(0, 0, mc.width, mc.height); mx.drawImage(state.cut.alphaCanvas, 0, 0);
          window.__out.mask = await toBlob(mc); free(mc);
        }
        const combos = BGS.map((b) => [b.id, 'feed']).concat([['salon', 'story'], ['balloon', 'story'], ['table', 'post'], ['velvet', 'post']]);
        for (const [b, f] of combos) {
          const t = performance.now(), c = composeImage(b, f);
          window.__times[`${b}-${f}`] = Math.round(performance.now() - t);
          window.__out[`${b}-${f}`] = await toBlob(c); free(c);
        }
      } else {
        $('start').click();
        for (let k = 0; k < 80 && $('shutter').disabled && $('s-pick').hidden; k++) await sleep(100);
        await sleep(2500);
        if (!$('preview').hidden) window.__out.preview = await toBlob($('preview'));
        window.__live = { on: live.on, note: $('live-note').textContent, video: video.videoWidth + 'x' + video.videoHeight };
        if (!$('shutter').disabled) await shoot();
        window.__out.result = state.blob;
      }
    } catch (e) { window.__error = String(e && e.stack || e); }
    window.__done = true;
  }, 300);
}
})();
